# Deploy static content to NAS (ovenytt.no) via GHOST self-hosted runner
name: Deploy to NAS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy-nas:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to NAS
        shell: cmd
        run: |
          tar -cf "%TEMP%\ovenytt-site.tar" --exclude=.git --exclude=.github --exclude=README.md --exclude=LICENSE .
          scp -O -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -i C:\Windows\system32\config\systemprofile\.ssh\nas_key "%TEMP%\ovenytt-site.tar" admin@192.168.1.154:/tmp/ovenytt-site.tar
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -i C:\Windows\system32\config\systemprofile\.ssh\nas_key admin@192.168.1.154 "rm -rf /volume1/web/ovenytt/*; cd /volume1/web/ovenytt && tar -xf /tmp/ovenytt-site.tar && rm -f /tmp/ovenytt-site.tar"
          del "%TEMP%\ovenytt-site.tar"
          echo Deployed to NAS /volume1/web/ovenytt/