# Deploy static content to NAS (ovenytt.no) via GHOST self-hosted runner
name: Deploy to NAS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy-nas:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to NAS
        shell: cmd
        run: |
          set SSH_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -i C:\Windows\system32\config\systemprofile\.ssh\nas_key
          tar -cf "%TEMP%\ovenytt-site.tar" --exclude=.git --exclude=.github --exclude=README.md --exclude=LICENSE .
          ssh %SSH_OPTS% admin@192.168.1.154 "rm -rf /volume1/web/ovenytt/*"
          type "%TEMP%\ovenytt-site.tar" | ssh %SSH_OPTS% admin@192.168.1.154 "cd /volume1/web/ovenytt && tar -xf -"
          del "%TEMP%\ovenytt-site.tar"
          echo Deployed to NAS /volume1/web/ovenytt/