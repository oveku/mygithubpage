# Deploy static content to NAS (ovenytt.no) via GHOST self-hosted runner
name: Deploy to NAS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy-nas:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to NAS
        shell: pwsh
        run: |
          $tarFile = Join-Path $env:TEMP "ovenytt-site.tar"
          tar -cf $tarFile --exclude=.git --exclude=.github --exclude=README.md --exclude=LICENSE .
          ssh nas-deploy "rm -rf /volume1/web/ovenytt/*"
          $p = Start-Process -FilePath "ssh" -ArgumentList 'nas-deploy','cd /volume1/web/ovenytt && tar -xf -' -RedirectStandardInput $tarFile -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Deploy failed with exit code $($p.ExitCode)" }
          Remove-Item $tarFile -Force
          Write-Host "Deployed to NAS /volume1/web/ovenytt/"