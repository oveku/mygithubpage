# Deploy static content to NAS (ovenytt.no) via GHOST self-hosted runner
name: Deploy to NAS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy-nas:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mount NAS share
        shell: pwsh
        run: |
          net use \\nassejr\web /user:admin ${{ secrets.NAS_PASSWORD }} /persistent:no
          if ($LASTEXITCODE -ne 0) { throw "Failed to mount NAS share" }

      - name: Deploy to NAS
        shell: pwsh
        run: |
          $src = "${{ github.workspace }}"
          $dst = "\\nassejr\web\ovenytt"
          $exclude = @('.git', '.github')

          if (-not (Test-Path $dst)) { throw "NAS share not accessible: $dst" }

          # Mirror site content, excluding .git and .github
          # robocopy exit codes 0-7 are success; 8+ are failures
          robocopy $src $dst /MIR /XD $exclude /XF README.md LICENSE /NFL /NDL /NP /NJH /NJS
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

          $count = (Get-ChildItem $dst -Recurse -File).Count
          Write-Host "Deployed $count files to $dst"